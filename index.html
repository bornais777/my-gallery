    <label class="field mt"><span>统一环境（每个镜头默认带上）</span><textarea class="auto mono" rows="1" data-bf="setting">${esc(b.setting)}</textarea></label>
  </div>
  <div class="bbar">${progressHTML(b)}${runBtns(b)}</div>
  <div class="shots">${b.shots.map((s, i) => shotHTML(b, s, i)).join('')}<button class="shot add glass" data-act="bd-shot-add">${ic('plus', 22)}<span>加一个镜头</span></button></div>`;
}
function shotMedia(s) {
  const st = { idle: '待生成', pending: '排队中', run: '生成中…', err: '失败' }[s.status] || '';
  return `<div class="smedia" style="aspect-ratio:${(SIZES[s.orientation] || SIZES.portrait).replace('x', '/')}" ${s.imgId ? `data-act="bd-lb" data-sid="${s.id}"` : ''}>
    ${s.thumbId ? `<img data-blob="${s.thumbId}" alt="">` : ''}
    ${s.status === 'run' ? '<div class="sload"><i></i></div>' : ''}
    ${!s.thumbId || s.status === 'run' || s.status === 'err' || s.status === 'pending' ? `<span class="sstat">${st}${s.status === 'err' && s.err ? `<small>${esc(s.err.slice(0, 120))}</small>` : ''}</span>` : ''}
  </div>`;
}
function shotHTML(b, s, i) {
  const pr = shotPrompt(b, s);
  return `<article class="shot glass st-${s.status}" data-sid="${s.id}">
    <div class="shead"><span class="snum">${i + 1}</span><b>${esc(s.beat || '镜头')}</b>
      <select class="ori" data-bs="${s.id}:orientation">${Object.entries(ORI).map(([k, t]) => `<option value="${k}" ${s.orientation === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <span class="sp"></span>
      <button class="btn xs ghost icon-btn" data-act="bd-shot-move" data-sid="${s.id}" data-d="-1" ${i ? '' : 'disabled'} aria-label="前移">${ic('up', 12)}</button>
      <button class="btn xs ghost icon-btn" data-act="bd-shot-move" data-sid="${s.id}" data-d="1" ${i < b.shots.length - 1 ? '' : 'disabled'} aria-label="后移">${ic('down', 12)}</button>
      <button class="btn xs ghost icon-btn" data-act="bd-shot-del" data-sid="${s.id}" aria-label="删除">${ic('trash', 12)}</button></div>
    ${shotMedia(s)}
    <div class="sbody">
      <input class="scn" data-bs="${s.id}:cn" value="${esc(s.cn)}" placeholder="画面说明">
      ${b.characters.length ? `<div class="schars">${b.characters.map((c, k) => `<button class="mchip ${(s.chars || []).includes(k) ? 'on' : ''}" data-act="bd-shot-char" data-sid="${s.id}" data-k="${k}">${esc(c.name)}</button>`).join('')}</div>` : ''}
      <label class="field"><span>镜头标签</span><textarea class="auto mono" rows="2" data-bs="${s.id}:tags">${esc(s.tags)}</textarea></label>
      ${(s.chars || []).map(k => b.characters[k] ? `<label class="field"><span>${esc(b.characters[k].name)} 的动作表情</span><textarea class="auto mono" rows="1" data-bs="${s.id}:act${k}">${esc(s.actions?.[k] || '')}</textarea></label>` : '').join('')}
      <details class="fprompt"><summary>最终提示词${pr.chars ? '（多角色分开写）' : ''}</summary><p class="ptxt sm mono">${esc(pr.prompt)}</p>${pr.chars ? pr.chars.map((c, k) => `<p class="ptxt sm mono"><b>角色 ${k + 1}：</b>${esc(c)}</p>`).join('') : ''}</details>
      <div class="sact"><button class="btn xs" data-act="bd-shot-run" data-sid="${s.id}">${ic('wand', 12)}${s.imgId ? '重画' : '只画这张'}</button>
      ${s.imgId ? `<button class="btn xs" data-act="bd-shot-save" data-sid="${s.id}" ${s.savedId ? 'disabled' : ''}>${s.savedId ? '已存' : `${ic('folder', 12)}存进画谱`}</button><button class="btn xs ghost" data-act="bd-shot-dl" data-sid="${s.id}">${ic('download', 12)}</button>` : ''}
      ${s.seed != null ? `<span class="muted sm">seed ${s.seed}</span>` : ''}</div>
    </div></article>`;
}
async function saveShot(b, s, folderId) {
  if (!s.imgId || s.savedId) return;
  const blob = await getBlob(s.imgId); if (!blob) return;
  const e = { id: uid(), createdAt: now(), source: 'gen', star: false, prompt: s.prompt || shotPrompt(b, s).prompt, negative: b.negative, chars: s.charPrompts || [], params: { seed: s.seed ?? null, steps: SET.nai.steps, scale: SET.nai.scale, sampler: SET.nai.sampler, modelRaw: b.model }, vibes: b.vibeId ? [{ vibeId: b.vibeId, strength: b.vibeStrength, info: 1, sig: null }] : [], tokens: [], folderId: folderId || '', note: `分镜「${b.title || ''}」第 ${b.shots.indexOf(s) + 1} 镜：${s.cn}` };
  e.tokens = tokenize(e.prompt); e.origId = s.imgId; e.thumbId = s.thumbId;
  const th = await getBlob(s.thumbId); const bmp = await createImageBitmap(blob); e.dims = { w: bmp.width, h: bmp.height }; bmp.close?.(); void th;
  e.fileHash = await sha256(await blob.arrayBuffer());
  await putEntry(e); s.savedId = e.id;
}
async function boardFolder(b) {
  const name = '分镜 · ' + (b.title || '未命名');
  let f = S.folders.find(x => x.name === name);
  if (!f) { f = { id: uid(), name, createdAt: now() }; await putFolder(f); }
  return f.id;
}

/* ================= 分镜：动作 ================= */
const bShot = el => { const b = curBoard(); return [b, b?.shots.find(s => s.id === el.dataset.sid)]; };
Object.assign(ACT, {
  'goto-queue': () => { S.view = 'story'; S.curBoard = QU.boardId; render(); },
  'bd-new': async () => { const b = newBoard(); await putBoard(b); S.curBoard = b.id; render(); },
  'bd-open': (el, ev) => { if (ev.target.closest('.fmenu')) return; S.curBoard = el.dataset.bid; render(); },
  'bd-del': async (el, ev) => {
    ev.stopPropagation(); const b = S.boards.find(x => x.id === el.dataset.bid); if (!b) return;
    if (QU.running && QU.boardId === b.id) return toast('这组正在生成，先暂停');
    if (!await ask(`删除分镜「${esc(b.title || '未命名')}」？`, '已经存进画谱的图不受影响。', [{ t: '取消', v: false }, { t: '删除', v: true, cls: 'danger' }])) return;
    await deleteBoard(b.id); if (S.curBoard === b.id) S.curBoard = null; render();
  },
  'bd-expand': () => { const b = curBoard(); if (b.shots.some(s => s.imgId)) { ask('重新扩写？', '会替换现有镜头，已生成但没存进画谱的图会丢掉。', [{ t: '取消', v: false }, { t: '重新扩写', v: true, cls: 'pri' }]).then(ok => ok && expandBoard(b)); } else expandBoard(b); },
  'bd-run': () => { const b = curBoard(); const todo = b.shots.filter(s => !s.imgId || s.status === 'err'); startQueue(b, todo.length ? null : b.shots.map(s => s.id)); },
  'bd-pause': () => { QU.pause = true; const b = curBoard(); if (b) updateShotUI(b, b.shots[0]); },
  'bd-shot-run': el => { const [b, s] = bShot(el); if (s) startQueue(b, [s.id]); },
  'bd-shot-save': async el => { const [b, s] = bShot(el); if (!s) return; await saveShot(b, s, await boardFolder(b)); await putBoard(b); toast('已存进画谱'); render(); },
  'bd-save-all': async () => { const b = curBoard(); const fid = await boardFolder(b); let n = 0; for (const s of b.shots) if (s.imgId && !s.savedId) { await saveShot(b, s, fid); n++; } await putBoard(b); toast(`存了 ${n} 张，在画谱的「分镜 · ${esc(b.title || '未命名')}」文件夹`); render(); classifyPending(true); },
  'bd-shot-dl': async el => { const [b, s] = bShot(el); const blob = s && await getBlob(s.imgId); if (blob) download(`${safeName(b.title || 'storyboard')}-${b.shots.indexOf(s) + 1}.png`, blob); },
  'bd-lb': el => {
    const b = curBoard(); const shots = b.shots.filter(s => s.imgId);
    const get = id => { const s = shots.find(x => x.id === id); return s && { thumbId: s.thumbId, origId: s.imgId, s }; };
    openLightbox(shots.map(s => s.id), shots.findIndex(s => s.id === el.dataset.sid), get, e => `${b.shots.indexOf(e.s) + 1} ${e.s.beat} · ${e.s.cn}`);
  },
  'bd-shot-del': async el => { const [b, s] = bShot(el); if (!s) return; if (s.status === 'run') return toast('这张正在生成'); b.shots = b.shots.filter(x => x !== s); for (const id of [s.imgId, s.thumbId]) if (id && !blobRefd(id)) await DB.del('blobs', id); await putBoard(b); render(); },
  'bd-shot-move': el => { const [b, s] = bShot(el); const i = b.shots.indexOf(s), j = i + +el.dataset.d; if (j < 0 || j >= b.shots.length) return; [b.shots[i], b.shots[j]] = [b.shots[j], b.shots[i]]; putBoard(b); render(); },
  'bd-shot-add': () => { const b = curBoard(); b.shots.push({ id: uid(), beat: '新镜头', cn: '', tags: '', chars: b.characters.length ? [0] : [], actions: {}, orientation: 'portrait', useSetting: true, status: 'idle' }); putBoard(b); render(); },
  'bd-shot-char': el => { const [b, s] = bShot(el); const k = +el.dataset.k; s.chars = (s.chars || []).includes(k) ? s.chars.filter(x => x !== k) : [...(s.chars || []), k].sort(); putBoard(b); const card = $(`.shot[data-sid="${s.id}"]`); if (card) { card.outerHTML = shotHTML(b, s, b.shots.indexOf(s)); growAll($(`.shot[data-sid="${s.id}"]`)); observeThumbs(); } },
  'bd-char-add': () => { const b = curBoard(); b.characters.push({ name: '角色 ' + (b.characters.length + 1), tags: '1girl' }); putBoard(b); render(); },
  'bd-char-del': async el => { const b = curBoard(); const i = +el.dataset.i; if (!await ask(`删除角色「${esc(b.characters[i].name)}」？`, '镜头里会去掉这个角色。', [{ t: '取消', v: false }, { t: '删除', v: true, cls: 'danger' }])) return; b.characters.splice(i, 1); for (const s of b.shots) { s.chars = (s.chars || []).filter(k => k !== i).map(k => k > i ? k - 1 : k); const a = {}; for (const [k, v] of Object.entries(s.actions || {})) { const n = +k; if (n < i) a[n] = v; else if (n > i) a[n - 1] = v; } s.actions = a; } await putBoard(b); render(); },
});
function refreshFinalPrompt(b, s) {
  const el = $(`.shot[data-sid="${s.id}"] .fprompt`); if (!el) return;
  const pr = shotPrompt(b, s); const open = el.open;
  el.outerHTML = `<details class="fprompt" ${open ? 'open' : ''}><summary>最终提示词${pr.chars ? '（多角色分开写）' : ''}</summary><p class="ptxt sm mono">${esc(pr.prompt)}</p>${pr.chars ? pr.chars.map((c, k) => `<p class="ptxt sm mono"><b>角色 ${k + 1}：</b>${esc(c)}</p>`).join('') : ''}</details>`;
}
function boardField(t) {
  const b = curBoard(); if (!b) return false;
  if (t.dataset.bf) {
    const k = t.dataset.bf;
    b[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? (t.value === '' ? null : +t.value) : t.value;
    if (k === 'fixedSeed' && !t.checked) b.seed = null;
    if (k === 'mode') { boardSaveSoon(b); renderStory($('#main')); return true; }
    if (['artist', 'quality', 'setting'].includes(k)) b.shots.forEach(s => refreshFinalPrompt(b, s));
  } else if (t.dataset.bc) {
    const [i, f] = t.dataset.bc.split(':'); const c = b.characters[+i]; if (!c) return true; c[f] = t.value;
    if (f === 'tags') b.shots.forEach(s => refreshFinalPrompt(b, s));
    if (f === 'name') $$(`.mchip[data-k="${i}"]`).forEach(x => x.textContent = t.value);
  } else if (t.dataset.bs) {
    const [sid, f] = t.dataset.bs.split(':'); const s = b.shots.find(x => x.id === sid); if (!s) return true;
    if (f.startsWith('act')) (s.actions ||= {})[f.slice(3)] = t.value; else s[f] = t.value;
    if (f === 'orientation') { const m = $(`.shot[data-sid="${s.id}"] .smedia`); if (m) m.style.aspectRatio = SIZES[s.orientation].replace('x', '/'); }
    refreshFinalPrompt(b, s);
  } else return false;
  boardSaveSoon(b); return true;
}
document.addEventListener('input', ev => { if (S.view === 'story' && ev.target.type !== 'checkbox' && ev.target.tagName !== 'SELECT') boardField(ev.target); });
document.addEventListener('change', async ev => {
  if (S.view !== 'story') return; const t = ev.target;
  if (t.type === 'checkbox' || t.tagName === 'SELECT' || t.type === 'number') { if (boardField(t)) { if (t.dataset.bf === 'fixedSeed') renderStory($('#main')); return; } }
  const b = curBoard();
  if (t.id === 'bdRow') { const e = byId(t.value); if (e) { b.artist = artistStringOf(e); $('[data-bf="artist"]').value = b.artist; b.shots.forEach(s => refreshFinalPrompt(b, s)); boardSaveSoon(b); } t.value = ''; }
  if (t.id === 'bdCard') {
    const c = S.cards.find(x => x.id === t.value); t.value = ''; if (!c) return;
    if (!aiReady()) { b.charsText = `${c.data.name}：${c.data.description.slice(0, 400)}`; }
    else { const tt = toast('AI 正在从角色卡提取外观…', 60000); try { const j = await aiAppearance(`角色名：${c.data.name}\n${c.data.description}`); b.charsText = (b.charsText.trim() ? b.charsText.trim() + '\n' : '') + `${c.data.name}：${j.tags}`; } catch (err) { toast('提取失败：' + esc(err.message), 5000); } tt.remove(); }
    const ta = $('[data-bf="charsText"]'); if (ta) { ta.value = b.charsText; autoGrow(ta); } boardSaveSoon(b);
  }
});
document.addEventListener('toggle', ev => { if (ev.target.classList?.contains('gparams')) S.bdParams = ev.target.open; }, true);

/* ================= 启动 ================= */
init();

</script>
