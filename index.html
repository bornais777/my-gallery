<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0ea">
<title>画谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f3f0ea;--ink:#1d1a24;--ink2:#58535f;--ink3:#9a95a2;
  --glass:rgba(255,255,255,.56);--glass2:rgba(255,255,255,.8);--field:rgba(255,255,255,.62);
  --stroke:rgba(255,255,255,.78);--line:rgba(30,24,44,.09);
  --accent:#6a5bff;--accent-soft:rgba(106,91,255,.12);--pink:#ff7aa8;
  --yellow:#ffe27d;--yellow-ink:#5a4300;--yellow-soft:rgba(255,214,90,.28);--danger:#e0464d;
  --r:26px;--r2:18px;--r3:12px;
  --sh:0 22px 48px -22px rgba(46,30,96,.32),0 2px 8px -3px rgba(46,30,96,.08);
  --blur:blur(22px) saturate(1.6);--orb:.62;--tw:210px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e0d14;--ink:#efecf7;--ink2:#b4afc1;--ink3:#77728a;
  --glass:rgba(30,27,45,.56);--glass2:rgba(38,35,56,.86);--field:rgba(10,8,18,.4);
  --stroke:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
  --accent:#a094ff;--accent-soft:rgba(160,148,255,.16);
  --yellow:#e9c548;--yellow-ink:#2a1f00;--yellow-soft:rgba(233,197,72,.2);
  --sh:0 22px 48px -22px rgba(0,0,0,.7),0 2px 8px -3px rgba(0,0,0,.4);--orb:.2;color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0e0d14;--ink:#efecf7;--ink2:#b4afc1;--ink3:#77728a;
  --glass:rgba(30,27,45,.56);--glass2:rgba(38,35,56,.86);--field:rgba(10,8,18,.4);
  --stroke:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
  --accent:#a094ff;--accent-soft:rgba(160,148,255,.16);
  --yellow:#e9c548;--yellow-ink:#2a1f00;--yellow-soft:rgba(233,197,72,.2);
  --sh:0 22px 48px -22px rgba(0,0,0,.7),0 2px 8px -3px rgba(0,0,0,.4);--orb:.2;color-scheme:dark}
html,body{margin:0}
body{font-family:"Inter","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
img{display:block}
h1,h2,h3,p{margin:0}
.ic{flex:none}
.muted{color:var(--ink3)} .sm{font-size:12px}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--orb)}
.orbs i:nth-child(1){width:55vw;height:55vw;left:-14vw;top:-20vw;background:#c6b4ff}
.orbs i:nth-child(2){width:42vw;height:42vw;right:-12vw;top:10vh;background:#ffbfd2}
.orbs i:nth-child(3){width:48vw;height:48vw;left:26vw;bottom:-24vw;background:#b2e2ff}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:var(--sh)}

/* 顶栏 */
.top{position:sticky;top:12px;z-index:50;max-width:1440px;margin:12px auto 0;width:calc(100% - 24px);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-radius:999px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.02em;margin-right:6px}
.logo{width:24px;height:24px;border-radius:8px;background:conic-gradient(from 200deg,#8b7bff,#ff8db3,#ffd27a,#8be0ff,#8b7bff);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs button{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s}
.tabs button:hover{background:var(--accent-soft);color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.adds{display:flex;gap:6px}
.sync-badge{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--ink2);background:var(--field);border:1px solid var(--line)}
.sync-badge.dirty{color:#b07800} .sync-badge.busy .ic{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-size:13.5px;white-space:nowrap;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(40,30,90,.35)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px}
.btn.xs{height:26px;padding:0 10px;font-size:12px;gap:4px}
.btn.danger{color:var(--danger)}
.btn.icon-btn{width:36px;padding:0}
.btn.xs.icon-btn{width:26px}
.btn.tgl.on{background:var(--accent);color:#fff;border-color:transparent}
.btn.loading{pointer-events:none;opacity:.7}
.btn.loading .ic{animation:spin 1s linear infinite}

main{max-width:1440px;margin:0 auto;padding:18px 18px 140px}

/* 首页 */
.hero{text-align:center;padding:26px 0 0}
.hero h1{font-size:46px;font-weight:800;letter-spacing:.06em;background:linear-gradient(120deg,var(--ink) 30%,var(--accent) 70%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ink2);margin-top:6px}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:38px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--ink3);min-width:200px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.hero-search{max-width:360px;margin:18px auto 0;height:44px}
.fan{position:relative;height:calc(var(--fw) * 1.5 + 130px);margin-top:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden}
.fan:active{cursor:grabbing}
.fcard{position:absolute;left:50%;top:calc(50% + 10px);width:var(--fw);aspect-ratio:2/3;margin-left:calc(var(--fw) / -2);margin-top:calc(var(--fw) * -.75);border-radius:24px;overflow:hidden;background:var(--glass2);border:1px solid var(--stroke);box-shadow:0 28px 50px -26px rgba(30,20,70,.55);transform-origin:50% 175%;will-change:transform}
.fcard img{width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;transition:opacity .4s}
.fcard img.ld{opacity:1}
.fcard.center{box-shadow:0 40px 80px -30px rgba(90,70,220,.65),0 0 0 2px rgba(255,255,255,.55)}
.fcard .lab{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:15px;background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#1d1a24;font-size:12.5px}
.fcard .lab b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .lab span{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.08)}
.noimg-f{height:100%;display:grid;place-items:center;padding:24px;text-align:center;background:linear-gradient(160deg,#c9bbff,#ffc4d7 60%,#ffe2a8);color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 12px rgba(80,40,120,.35);word-break:break-word}
.fan-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:-8px;color:var(--ink2);font-variant-numeric:tabular-nums}
.fan-ctrl .btn:first-child .ic{transform:rotate(180deg)}
.az{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:720px;margin:18px auto 0;padding:6px;border-radius:999px}
.az button{width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:600;color:var(--ink2)}
.az button:hover:not(:disabled){background:var(--accent);color:#fff}
.hint{text-align:center;color:var(--ink3);font-size:12px;margin-top:14px}
.welcome{max-width:760px;margin:30px auto;padding:22px;border-radius:var(--r)}
.welcome>p{font-weight:600;margin-bottom:12px}
.wel-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.wbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:var(--r2);background:var(--glass2);border:1px solid var(--line);text-align:left;transition:transform .2s}
.wbtn:hover{transform:translateY(-3px)}
.wbtn .ic{color:var(--accent)} .wbtn span{font-size:12px;color:var(--ink3)}

/* 弹出牌 */
.modal.pop{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:24px;align-items:start;width:min(860px,100%)}
.pop-card{border-radius:24px;overflow:hidden;aspect-ratio:2/3;background:var(--glass2);box-shadow:0 30px 60px -26px rgba(60,40,150,.55);animation:cardpop .45s cubic-bezier(.2,.9,.3,1.25) both}
.pop-card img{width:100%;height:100%;object-fit:cover}
@keyframes cardpop{from{transform:translateY(60px) rotate(-6deg) scale(.82);opacity:0}}
.pop-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.pop-strip{display:flex;flex-wrap:wrap;gap:8px}
.ps{width:64px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;transition:transform .2s}
.ps:hover{transform:translateY(-3px) rotate(-2deg)}
.ps img{width:100%;height:100%;object-fit:cover}

/* 画师串 */
.lib-head{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border-radius:var(--r)}
.toolbar .search{flex:1}
select,.inp,.field input,.field textarea{height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);outline:none;transition:border-color .2s,box-shadow .2s}
.toolbar select{border-radius:999px}
select:focus,.inp:focus,.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slider{display:flex;align-items:center;gap:6px;color:var(--ink3);padding:0 6px}
.slider input{width:100px;accent-color:var(--accent)}
.notice{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r2);font-size:13px}
.notice span{flex:1}
.filter-note{display:flex;align-items:center;gap:8px;font-size:13px}
.folders{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);white-space:nowrap;font-size:13px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.fchip i{font-style:normal;font-size:11px;color:var(--ink3)}
.fchip.on{background:var(--ink);color:var(--bg)} .fchip.on i{color:inherit;opacity:.6}
.fchip.add{color:var(--accent);border-style:dashed;border-color:var(--accent)}
.fmenu{margin-right:-6px;width:20px;height:20px;border-radius:50%;line-height:1}
.fmenu:hover{background:rgba(127,127,127,.2)}
.rows-meta{font-size:12px;margin:6px 4px}
.row{margin:14px 0;padding:14px 14px 6px;border-radius:var(--r);transition:box-shadow .4s}
.row.flash{box-shadow:0 0 0 3px var(--accent),var(--sh)}
.row-h{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.row-names{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;flex:1;min-width:0;font-weight:650}
.row-names.big{font-size:18px}
.rn{white-space:nowrap}
.dot{width:4px;height:4px;border-radius:50%;background:var(--ink3);display:inline-block}
.count{font-size:12px;color:var(--ink3);white-space:nowrap}
.rowtgl .ic{transition:transform .3s}
.row.open .rowtgl .ic{transform:rotate(180deg)}
.track{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:thin;scroll-behavior:auto}
.track.dragging{cursor:grabbing;user-select:none}
.track.dragging *{pointer-events:none}
.rest{display:flex;align-items:flex-start;gap:14px}
.row.anim .rest .card{animation:slidein .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes slidein{from{opacity:0;transform:translateX(-60px) scale(.94) rotate(-2deg)}}
.card{flex:0 0 var(--tw);width:var(--tw);border-radius:var(--r2);background:var(--glass2);border:1px solid var(--line);position:relative;transition:width .3s,flex-basis .3s,box-shadow .2s}
.card.open{flex-basis:max(var(--tw),330px);width:max(var(--tw),330px)}
.card.sel{box-shadow:0 0 0 3px var(--accent)}
.card.stacked{margin-right:16px;box-shadow:7px 6px 0 -1px var(--glass2),7px 6px 0 0 var(--line),14px 12px 0 -2px var(--glass2),14px 12px 0 -1px var(--line)}
.img{position:relative;aspect-ratio:var(--ar,2/3);max-height:calc(var(--tw) * 1.8);border-radius:var(--r2) var(--r2) 10px 10px;overflow:hidden;background:linear-gradient(135deg,rgba(127,118,150,.14),rgba(127,118,150,.05));cursor:pointer}
.img>img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s,transform .5s}
.img>img.ld{opacity:1}
.img:hover>img{transform:scale(1.025)}
.noimg{position:absolute;inset:8px;border:1.5px dashed var(--ink3);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:.85}
.noimg-b{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ov-top{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;align-items:center}
.ov-top .sp{flex:1}
.tag-base,.tag-y{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.tag-base{background:rgba(255,255,255,.75);color:#1d1a24;backdrop-filter:blur(8px)}
.tag-y{background:var(--yellow);color:var(--yellow-ink)}
.star{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);color:#5a5566;opacity:0;transition:opacity .2s,transform .2s}
.card:hover .star,.star.on{opacity:1}
.star.on{color:#f5a623} .star.on svg{fill:currentColor}
.star:hover{transform:scale(1.1)}
@media (hover:none){.star{opacity:1}}
.stack-n{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;padding:6px 11px;border-radius:14px;background:rgba(20,16,34,.5);backdrop-filter:blur(12px);color:#fff;line-height:1.2}
.stack-n b{font-size:18px} .stack-n small{font-size:10.5px;opacity:.85}
.lb-btn{position:absolute;left:8px;bottom:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.6);backdrop-filter:blur(10px);color:#2a2633;opacity:0;transition:opacity .2s}
.card:hover .lb-btn{opacity:1}
@media (hover:none){.lb-btn{opacity:.9}}
.selbox{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.85);border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent)}
.body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:7px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:12px;line-height:1.35;background:rgba(127,118,150,.12);color:var(--ink);cursor:pointer;border:1px solid transparent;max-width:100%;word-break:break-word;text-align:left}
.chip.artist{font-weight:650}
.chip.style{font-style:italic}
.chip i{font-style:normal;font-weight:500;font-size:10.5px;opacity:.65}
.chip.mono{filter:grayscale(1)}
.chip.hl{background:var(--yellow);color:var(--yellow-ink)}
.chip.hl i{opacity:.8}
.chip.general{color:var(--ink3);font-weight:400}
.chip.big{font-size:13px;padding:5px 11px}
.chip.cat::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink3)}
.chip.cat-artist::before{background:var(--accent)} .chip.cat-style::before{background:var(--pink)}
.chip.cat-scene{opacity:.62} .chip.cat-pending{border:1px dashed var(--ink3)} .chip.cat-pending::before{background:transparent;border:1px solid var(--ink3)}
.chip .wt{width:46px;height:20px;padding:0 4px;border-radius:6px;border:1px solid var(--line);background:var(--field);font-size:11px}
.chip button{display:grid;place-items:center;opacity:.6}
.removed{display:flex;flex-wrap:wrap;gap:4px 8px}
.removed s{color:var(--ink3);font-size:12px}
.vtags{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:9px}
.vtags.hl{background:var(--yellow-soft)}
.vtag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:8px;font-size:11.5px;cursor:pointer;max-width:100%}
.vtag b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.vtag i{font-style:normal;opacity:.7}
.vtag.solid{background:var(--accent-soft);color:var(--accent)}
.vtag.solid img{width:22px;height:22px;border-radius:6px;object-fit:cover}
.vtag.hollow{padding:3px 8px;border:1.5px solid var(--ink3);color:var(--ink2)}
.sq{width:10px;height:10px;border:1.6px solid currentColor;border-radius:2px;display:inline-block}
.sq.f{background:currentColor;margin-left:5px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
.card-foot .muted{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--line);padding-top:11px;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
.xp-l{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:650;color:var(--ink2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.ptxt{font-size:12.5px;line-height:1.6;word-break:break-word;white-space:pre-wrap;background:var(--field);padding:8px 10px;border-radius:10px;max-height:220px;overflow:auto;user-select:text}
.ptxt.neg{color:var(--ink2)}
.meta-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.meta-grid span{color:var(--ink3)} .meta-grid b{font-weight:550;word-break:break-all}
.note{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);white-space:pre-wrap}
.xp-act{display:flex;flex-wrap:wrap;gap:5px}
.recipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw),1fr));gap:14px;align-items:start}
.recipe .card{width:auto}
.empty{padding:40px 20px;text-align:center;border-radius:var(--r);color:var(--ink2);display:flex;flex-direction:column;gap:6px;align-items:center;grid-column:1/-1}
.empty p{font-size:13px;color:var(--ink3)}

/* 页面通用 */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:10px 4px 16px;flex-wrap:wrap}
.page-h h2{font-size:26px;font-weight:750}
.page-h h3{font-size:17px}
.page-h p{margin-top:4px;font-size:13px}
.page-h.sub{margin-top:30px}

/* vibe */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.vcard{border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .4s}
.vcard.flash{box-shadow:0 0 0 3px var(--accent),var(--sh)}
.vprev{position:relative;aspect-ratio:1;background:var(--field);display:grid;place-items:center}
.vprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.vprev img.ld{opacity:1}
.vrep{position:absolute;right:10px;bottom:10px;opacity:0;transition:opacity .2s}
.vcard:hover .vrep{opacity:1}
.venc{position:absolute;left:10px;top:10px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.75);color:#2a2633}
.vbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}
.vname{font-size:16px;font-weight:700;border:0;background:none;outline:none;padding:2px 0;border-bottom:1px dashed transparent}
.vname:focus{border-bottom-color:var(--accent)}
.vbody textarea{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:7px 10px;resize:vertical;outline:none;font-size:13px}
.vmodels{display:flex;flex-wrap:wrap;gap:5px}
.mchip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--field)}
.mchip.on{background:var(--accent);color:#fff;border-color:transparent}
.vuse{font-size:12.5px;color:var(--ink2)} .vuse b{font-size:16px;color:var(--ink)}
.vthumbs{display:flex;flex-wrap:wrap;gap:5px}
.vthumbs button{width:42px;height:56px;border-radius:8px;overflow:hidden;background:var(--field);display:grid;place-items:center}
.vthumbs img{width:100%;height:100%;object-fit:cover}
.vact{display:flex;justify-content:flex-end}
.hollow{padding:14px;border-radius:var(--r)}
.hgrid{display:flex;flex-wrap:wrap;gap:8px}
.hitem{position:relative;width:78px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--field);display:grid;place-items:center;border:2px solid transparent}
.hitem.on{border-color:var(--accent)}
.hitem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hitem i{position:absolute;left:4px;right:4px;bottom:4px;font-style:normal;font-size:10.5px;padding:1px 4px;border-radius:6px;background:rgba(255,255,255,.8);color:#222}
.hbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.vpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:14px 0}
.vpick button{display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px;border-radius:14px;background:var(--field);border:1px solid var(--line);transition:transform .2s}
.vpick button:hover{transform:translateY(-2px);border-color:var(--accent)}
.vpick img,.vpick span{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:grid;place-items:center}
.vpick b{font-size:12px;font-weight:600}

/* 索引、查重 */
.aidx{padding:14px 16px;border-radius:var(--r2);margin-bottom:12px}
.aidx h3{font-size:15px;margin-bottom:8px;color:var(--accent)}
.dup-list{display:flex;flex-direction:column;gap:10px}
.dupitem{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:var(--r2)}
.dthumbs{display:flex;gap:6px}
.dthumbs img,.dthumbs span{width:46px;height:64px;border-radius:9px;object-fit:cover;background:var(--field);display:grid;place-items:center}
.dinfo{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.dinfo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dinfo .tag-y{align-self:flex-start}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}
.dside{display:flex;flex-direction:column;gap:9px;min-width:0}
.dlabel{font-size:12px;font-weight:650;color:var(--ink2)}
.dimg{aspect-ratio:2/3;max-height:340px;border-radius:14px;overflow:hidden;background:var(--field);display:grid;place-items:center}
.dimg img{width:100%;height:100%;object-fit:contain}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable td{padding:4px 6px;border-bottom:1px solid var(--line);word-break:break-all}
.ptable td:first-child{color:var(--ink3);width:62px}
.ptable tr.hl td{background:var(--yellow-soft)}

/* 设置 */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
.scard{padding:18px;border-radius:var(--r);display:flex;flex-direction:column;gap:2px}
.scard h3{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:12px;flex-wrap:wrap}
.scard h3 .muted{font-size:12px;font-weight:400}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;min-width:0}
.field>span{font-size:12px;color:var(--ink2)}
.field em{font-style:normal}
.field textarea{height:auto;padding:9px 12px;resize:vertical;line-height:1.55}
.mono-ta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.f4{display:grid;grid-template-columns:1.3fr 1fr .8fr .8fr;gap:10px}
.srow{display:flex;align-items:center;gap:10px;margin-top:4px}
.srow.wrap{flex-wrap:wrap;margin-bottom:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 6px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.row-inline{display:flex;gap:8px;align-items:center;margin-top:6px}
.row-inline .inp{flex:1}

/* 弹窗 */
#modals .mask{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(18,12,34,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s}
#modals .mask.out{animation:fade .18s reverse forwards}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:28px;padding:22px;background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke);box-shadow:0 40px 90px -30px rgba(20,10,60,.55);animation:rise .32s cubic-bezier(.2,.9,.3,1.15)}
.modal.wide{width:min(980px,100%)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.modal h3{font-size:18px;margin-bottom:6px}
.modal>.muted{font-size:13px}
.ask-body{color:var(--ink2);font-size:13.5px;margin:6px 0 4px}
.modal .inp{width:100%;margin-top:10px}
.m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.ed-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ed-grid{display:grid;grid-template-columns:1fr 280px;gap:20px}
.ed-side{display:flex;flex-direction:column;gap:10px}
.ed-img{aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:var(--field);border:1px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:12px}
.ed-img img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.ed-img img.ld{opacity:1}
.gen-box{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:999px;background:var(--field)}
.seg button{height:30px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.vslots{display:flex;flex-direction:column;gap:6px}
.vslot{display:grid;grid-template-columns:1fr 80px 90px 26px;gap:6px;align-items:center}
.vslot input{height:32px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--field);outline:none}
.vslot select{height:32px}
.popmenu{position:fixed;z-index:200;min-width:150px;padding:6px;border-radius:16px;display:flex;flex-direction:column;animation:rise .18s}
.popmenu button{text-align:left;padding:8px 12px;border-radius:10px;font-size:13px}
.popmenu button:hover{background:var(--accent-soft)}
.popmenu button.on{color:var(--accent);font-weight:650}
.popmenu button.on::after{content:" ✓"}
.popmenu button.danger{color:var(--danger)}
.popmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pm-label{font-size:11.5px;color:var(--ink3);padding:4px 12px 6px;max-width:260px;word-break:break-word}

/* toast、底栏 */
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{padding:10px 18px;border-radius:999px;font-size:13px;animation:rise .25s;pointer-events:auto;text-align:center}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
.bulk{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:60;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 18px;border-radius:999px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.bulk.show{transform:translate(-50%,0)}
.bnav,.fab,.fab-menu{display:none}
body.dropping::after{content:"松手导入";position:fixed;inset:12px;z-index:400;border:3px dashed var(--accent);border-radius:30px;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--accent);background:rgba(106,91,255,.08);backdrop-filter:blur(6px)}

/* 灯箱 */
.lb{position:fixed;inset:0;z-index:150;background:rgba(8,6,16,.9);backdrop-filter:blur(8px);animation:fade .2s}
.lb-stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none}
.lbimg{max-width:94vw;max-height:90vh;border-radius:14px;transition:transform .12s;user-select:none}
.lb-x,.lb-p,.lb-n{position:absolute;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(10px)}
.lb-x{top:16px;right:16px}
.lb-p{left:16px;top:50%;transform:translateY(-50%) rotate(180deg)} .lb-n{right:16px;top:50%;transform:translateY(-50%)}
.lb-c{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:12px;color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 手机 */
@media (max-width:820px){
  .top{border-radius:22px;padding:8px 10px 8px 14px}
  .tabs,.adds{display:none}
  .brand{flex:1}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:55;border-radius:24px;padding:6px}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;font-size:10.5px;color:var(--ink2)}
  .bnav button.on{background:var(--ink);color:var(--bg)}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:56;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--bg);box-shadow:0 14px 30px -10px rgba(40,20,90,.55)}
  .fab-menu{display:flex;flex-direction:column;gap:4px;position:fixed;right:18px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:56;padding:8px;border-radius:20px;transform:scale(.8) translateY(20px);transform-origin:bottom right;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.9,.3,1.2)}
  .fab-menu.show{transform:none;opacity:1;pointer-events:auto}
  .fab-menu button{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;font-size:14px;text-align:left}
  .fab-menu button:active{background:var(--accent-soft)}
  main{padding:14px 10px 170px}
  .hero h1{font-size:36px}
  .toolbar .search{flex-basis:100%}
  .slider input{width:80px}
  .row{padding:12px 10px 4px;margin:10px 0}
  .modal{padding:18px;border-radius:24px}
  .modal.pop{grid-template-columns:1fr}
  .pop-card{max-width:260px;margin:0 auto;width:100%}
  .ed-grid{grid-template-columns:1fr}
  .ed-img{max-height:260px;aspect-ratio:auto;height:220px}
  .f4{grid-template-columns:1fr 1fr}
  .dgrid{gap:10px}
  .sgrid{grid-template-columns:1fr}
  .bulk{bottom:calc(90px + env(safe-area-inset-bottom))}
  #toasts{bottom:calc(96px + env(safe-area-inset-bottom))}
  .card.open{flex-basis:min(330px,82vw);width:min(330px,82vw)}
}

/* 修正 */
.fan{isolation:isolate}
.sync-badge[hidden]{display:none}
.scard,.sgrid>*{min-width:0}
.field input,.field select,.field textarea{width:100%;max-width:100%}
select{max-width:100%;text-overflow:ellipsis}

}

/* ===== 导航（8 个页面） ===== */
@media (max-width:1320px){.tabs button:not(.on) span{display:none}.tabs button{padding:8px 11px}}
body:not([data-view=home]):not([data-view=library]):not([data-view=vibes]) .adds{display:none}
@media (max-width:820px){.bnav{grid-template-columns:repeat(5,1fr)}}
.sp{flex:1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.btn.wide{width:100%;height:44px;font-size:15px}
.mt{margin-top:6px}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:rgba(127,118,150,.3);transition:background .2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
.sw input:checked+i{background:var(--accent)}

.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

<script>
'use strict';
/* ================= 工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Date.now();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const td = new TextDecoder();
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
async function sha256(buf) { const d = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function u8ToB64(u8) { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); }
function b64ToU8(b64) { const bin = atob(String(b64).replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
const b64ToBlob = (b64, mime = 'application/octet-stream') => new Blob([b64ToU8(b64)], { type: mime });
async function blobToB64(b) { return u8ToB64(new Uint8Array(await b.arrayBuffer())); }
const utf8B64 = s => u8ToB64(new TextEncoder().encode(s));
function dataURLtoBlob(u) { const [h, b] = String(u).split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'image/png'; return b64ToBlob(b, mime); }
async function inflate(u8, fmt) { const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream(fmt)); return new Uint8Array(await new Response(s).arrayBuffer()); }
function parseJSONLoose(t) {
  if (!t) throw new Error('AI 返回为空');
  t = String(t).replace(/```(?:json)?/gi, '');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('AI 没有返回 JSON');
  return JSON.parse(t.slice(a, b + 1));
}
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
const fmtTime = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

/* ================= 设置（只存本机，不同步） ================= */
const DEF = {
  text: { provider: 'openai', base: '', key: '', model: '', visionModel: '' },
  gpt: { mode: 'images', base: '', key: '', model: 'gpt-image-1', size: '1024x1536' },
  nai: { mode: 'nai', base: '', key: '', model: 'nai-diffusion-4-5-full', size: '832x1216', steps: 28, scale: 5, sampler: 'k_euler_ancestral', neg: 'lowres, artistic error, worst quality, bad quality, jpeg artifacts, very displeasing, watermark, signature, text', quality: 'best quality, amazing quality, very aesthetic, absurdres' },
  userName: 'User',
  models: [
    { match: 'V4\\.5 Curated|4-5-curated', label: 'V4.5 Curated', api: 'nai-diffusion-4-5-curated' },
    { match: 'V4\\.5|4-5-full', label: 'V4.5', api: 'nai-diffusion-4-5-full' },
    { match: 'V4 Curated|4-curated', label: 'V4 Curated', api: 'nai-diffusion-4-curated-preview' },
    { match: 'Diffusion V4\\b|4-full', label: 'V4', api: 'nai-diffusion-4-full' },
    { match: 'V3|diffusion-3', label: 'V3', api: 'nai-diffusion-3' },
  ],
  gh: { owner: '', repo: '', branch: 'main', dir: 'huapu', token: '', auto: true },
  thumb: 210, theme: 'auto',
};
function deepMerge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) deepMerge(a[k], b[k]); else a[k] = b[k]; } return a; }
function loadSettings() { try { return deepMerge(structuredClone(DEF), JSON.parse(localStorage.getItem('huapu.settings') || '{}')); } catch { return structuredClone(DEF); } }
let SET = loadSettings();
function saveSettings() { localStorage.setItem('huapu.settings', JSON.stringify(SET)); }
const getPath = (o, p) => p.split('.').reduce((x, k) => x?.[k], o);
function setPath(o, p, v) { const ks = p.split('.'); let x = o; ks.slice(0, -1).forEach(k => x = x[k]); x[ks.at(-1)] = v; }

/* ================= 状态 ================= */
const S = {
  entries: [], vibes: [], folders: [], cards: [], boards: [], tags: {}, blobIndex: {},
  curCard: null, cardTab: 'base', cardChat: {}, labDraft: {}, loreOpen: new Set(), rxOpen: new Set(), cardQ: '',
  curBoard: null,
  meta: { baseOverride: {}, keepPairs: [], tombstones: {} },
  view: sessionStorage.getItem('huapu.view') || 'home',
  filters: { q: '', model: '', vibe: 'any', star: false, folder: '', recipe: false, artist: '' },
  expanded: new Set(), openPrompts: new Set(), selected: new Set(), hsel: new Set(),
  selectMode: false, homeFocus: 0, homeRows: [], rowMap: {}, dupPairs: null,
  dirty: false, syncing: false, syncMsg: '', lastSync: +localStorage.getItem('huapu.lastSync') || 0,
  animRow: null, pop: null, lb: null,
};

/* ================= 存储层（可替换） ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('huapu', 2);
      r.onupgradeneeded = () => { const d = r.result; for (const s of ['entries', 'blobs', 'vibes', 'folders', 'kv', 'cards', 'boards']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' }); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const rq = fn(t.objectStore(store)); let out;
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(s) { return this.tx(s, 'readonly', os => os.getAll()); },
  keys(s) { return this.tx(s, 'readonly', os => os.getAllKeys()); },
  get(s, id) { return this.tx(s, 'readonly', os => os.get(id)); },
  put(s, o) { return this.tx(s, 'readwrite', os => os.put(o)); },
  del(s, id) { return this.tx(s, 'readwrite', os => os.delete(id)); },
  async kvGet(k, d) { const r = await this.get('kv', k); return r ? r.v : d; },
  kvSet(k, v) { return this.put('kv', { k, v }); },
};

function upsert(arr, o) { const i = arr.findIndex(x => x.id === o.id); if (i < 0) arr.push(o); else arr[i] = o; }
async function putEntry(e) { e.updatedAt = now(); await DB.put('entries', e); upsert(S.entries, e); markDirty(); }
function blobRefd(id) {
  return S.entries.some(e => e.origId === id || e.thumbId === id) || S.vibes.some(v => v.previewId === id || v.fileId === id)
    || S.cards.some(c => c.avatarId === id || c.thumbId === id)
    || S.boards.some(b => (b.shots || []).some(s => s.imgId === id || s.thumbId === id));
}
async function putCard(c) { c.updatedAt = now(); await DB.put('cards', c); upsert(S.cards, c); markDirty(); }
async function putBoard(b) { b.updatedAt = now(); await DB.put('boards', b); upsert(S.boards, b); markDirty(); }
async function deleteCard(id) {
  const c = S.cards.find(x => x.id === id);
  S.cards = S.cards.filter(x => x.id !== id); await DB.del('cards', id); S.meta.tombstones[id] = now(); await saveMeta();
  if (c) for (const b of [c.avatarId, c.thumbId]) if (b && !blobRefd(b)) await DB.del('blobs', b);
}
async function deleteBoard(id) {
  const bd = S.boards.find(x => x.id === id);
  S.boards = S.boards.filter(x => x.id !== id); await DB.del('boards', id); S.meta.tombstones[id] = now(); await saveMeta();
  if (bd) for (const s of bd.shots || []) for (const b of [s.imgId, s.thumbId]) if (b && !blobRefd(b)) await DB.del('blobs', b);
}
async function deleteEntry(id) {
  const e = S.entries.find(x => x.id === id);
  S.entries = S.entries.filter(x => x.id !== id);
  await DB.del('entries', id);
  S.meta.tombstones[id] = now();
  for (const k in S.meta.baseOverride) if (S.meta.baseOverride[k] === id) delete S.meta.baseOverride[k];
  S.openPrompts.delete(id); S.selected.delete(id);
  await saveMeta();
  if (e) for (const b of [e.origId, e.thumbId]) if (b && !blobRefd(b)) await DB.del('blobs', b);
}
async function putVibe(v) { v.updatedAt = now(); await DB.put('vibes', v); upsert(S.vibes, v); markDirty(); }
async function deleteVibe(id) {
  const v = S.vibes.find(x => x.id === id);
  S.vibes = S.vibes.filter(x => x.id !== id);
  await DB.del('vibes', id); S.meta.tombstones[id] = now();
  for (const e of S.entries) if (e.vibes?.some(s => s.vibeId === id)) { e.vibes.forEach(s => { if (s.vibeId === id) s.vibeId = null; }); await putEntry(e); }
  await saveMeta();
  if (v) for (const b of [v.previewId, v.fileId]) if (b && !blobRefd(b)) await DB.del('blobs', b);
}
async function putFolder(f) { f.updatedAt = now(); await DB.put('folders', f); upsert(S.folders, f); markDirty(); }
async function deleteFolder(id) {
  S.folders = S.folders.filter(x => x.id !== id); await DB.del('folders', id); S.meta.tombstones[id] = now();
  for (const e of S.entries) if (e.folderId === id) { e.folderId = ''; await putEntry(e); }
  await saveMeta();
}
async function saveMeta() { await DB.kvSet('meta', S.meta); markDirty(); }
async function saveTags() { await DB.kvSet('tags', S.tags); markDirty(); }
async function putBlob(id, blob, kind) { await DB.put('blobs', { id, blob, kind, mime: blob.type || 'application/octet-stream' }); }
async function getBlob(id) {
  if (!id) return null;
  const r = await DB.get('blobs', id);
  if (r) return r.blob;
  return await ghFetchBlob(id);
}
const urlCache = new Map();
async function blobURL(id) {
  if (!id) return null;
  if (urlCache.has(id)) return urlCache.get(id);
  const b = await getBlob(id).catch(() => null);
  if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(id, u); return u;
}

/* ================= 模型名映射 ================= */
function modelLabel(raw) {
  if (!raw) return '';
  for (const m of SET.models) { try { if (new RegExp(m.match, 'i').test(raw)) return m.label; } catch { } }
  return raw;
}
const entryModel = e => modelLabel(e.params?.modelRaw);
const modelApi = label => SET.models.find(m => m.label === label)?.api || label;

/* ================= 分词 ================= */
function normTag(s) {
  return String(s).replace(/^\s*artist\s*:\s*/i, '').replace(/\\([()[\]{}])/g, '$1').replace(/_/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
}
function tokenize(prompt) {
  const out = []; if (!prompt) return out;
  let curly = 0, square = 0, num = null, buf = '', tw = null;
  const cur = () => (num ?? 1) * Math.pow(1.05, curly - square);
  const flush = () => {
    const raw = buf.replace(/\s+/g, ' ').trim();
    if (raw) { const n = normTag(raw); if (n) out.push({ raw, n, w: Math.round((tw ?? 1) * 100) / 100, pre: /^artist\s*:/i.test(raw) }); }
    buf = ''; tw = null;
  };
  const s = String(prompt);
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '\\' && i + 1 < s.length) { buf += s[i + 1]; i++; if (tw === null) tw = cur(); continue; }
    if (ch === ',' || ch === '\n' || ch === '|' || ch === '，') { flush(); continue; }
    if (ch === '{') { curly++; continue; }
    if (ch === '}') { curly = Math.max(0, curly - 1); continue; }
    if (ch === '[') { square++; continue; }
    if (ch === ']') { square = Math.max(0, square - 1); continue; }
    if (ch === ':' && s[i + 1] === ':' && num !== null) { flush(); num = null; i++; continue; }
    if (num === null && !buf.trim()) {
      const m = s.slice(i, i + 12).match(/^(-?\d+(?:\.\d+)?)::/);
      if (m) { num = parseFloat(m[1]); i += m[0].length - 1; continue; }
    }
    buf += ch; if (tw === null && ch.trim()) tw = cur();
  }
  flush(); return out;
}

/* ================= 分类 ================= */
const GENERAL = new Set(['masterpiece', 'best quality', 'amazing quality', 'very aesthetic', 'aesthetic', 'absurdres', 'highres', 'high quality', 'ultra detailed', 'ultra-detailed', 'newest', 'very awa', 'incredibly absurdres', 'high resolution', 'no text', 'location', 'lowres', 'normal quality', 'worst quality', 'bad quality', 'low quality', 'displeasing', 'very displeasing', '8k', '4k', 'official art', 'highly detailed', 'detailed', 'great quality', 'good quality', 'extremely detailed']);

    const next = [];

async function sync(manual) {
  if (S.syncing) return;
  if (!GH.ok()) { if (manual) toast('先在设置里填 GitHub 仓库和令牌'); return; }
  S.syncing = true; S.syncMsg = '同步中'; renderSyncBadge();
  let changed = false;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const { data: remote, sha } = await GH.getJSON('library.json');
      changed = (await applyLib(mergeLib(localLib(), remote))) || changed;
      const keys = new Set(await DB.keys('blobs'));
      const refs = [];
      for (const e of S.entries) { if (e.thumbId) refs.push([e.thumbId, 'thumb']); if (e.origId) refs.push([e.origId, 'orig']); }
      for (const v of S.vibes) { if (v.previewId) refs.push([v.previewId, 'thumb']); if (v.fileId) refs.push([v.fileId, 'file']); }
      for (const c of S.cards) { if (c.thumbId) refs.push([c.thumbId, 'thumb']); if (c.avatarId) refs.push([c.avatarId, 'file']); }
      for (const b of S.boards) for (const s of b.shots || []) { if (s.thumbId) refs.push([s.thumbId, 'thumb']); if (s.imgId) refs.push([s.imgId, 'orig']); }
      const seenRef = new Set();
      const uniq = refs.filter(([id]) => !seenRef.has(id) && seenRef.add(id));
      refs.length = 0; refs.push(...uniq);
      const toUp = refs.filter(([id]) => !S.blobIndex[id] && keys.has(id));
      let i = 0;
      for (const [id, kind] of toUp) {
        i++; S.syncMsg = `上传 ${i}/${toUp.length}`; renderSyncBadge();
        const rec = await DB.get('blobs', id); if (!rec) continue;
        let bsha;
        try { bsha = await GH.put('blobs/' + id, await blobToB64(rec.blob), null, 'blob ' + id); }
        catch (err) { if (err.status === 422) { const m = await GH.meta('blobs/' + id); if (!m) throw err; bsha = m.sha; } else throw err; }
        S.blobIndex[id] = { sha: bsha, mime: rec.mime || rec.blob.type, kind };
        await DB.kvSet('blobIndex', S.blobIndex);
      }
      const toDown = refs.filter(([id, kind]) => kind !== 'orig' && S.blobIndex[id] && !keys.has(id));
      i = 0;
      for (const [id] of toDown) { i++; S.syncMsg = `下载 ${i}/${toDown.length}`; renderSyncBadge(); await ghFetchBlob(id); changed = true; }
      try {
        S.syncMsg = '写入索引'; renderSyncBadge();
        await GH.put('library.json', utf8B64(JSON.stringify(localLib())), sha, 'sync library');

  finally { S.syncing = false; S.syncMsg = ''; renderSyncBadge(); if (changed) render(); }
}

/* ================= 画师索引 ================= */
function renderArtists(main) {
  const m = new Map();
  for (const e of S.entries) for (const a of artistsOf(e)) m.set(a.n, (m.get(a.n) || 0) + 1);
  const groups = new Map();
  for (const [n, c] of [...m].sort((a, b) => a[0].localeCompare(b[0]))) { const L = /^[a-z]/i.test(n) ? n[0].toUpperCase() : '#'; if (!groups.has(L)) groups.set(L, []); groups.get(L).push([n, c]); }
  main.innerHTML = `<div class="page-h"><div><h2>画师索引</h2><p class="muted">${m.size} 位画师 · 名字统一成小写，下划线换成空格。点名字只看这位画师的串。</p></div></div>
  ${m.size ? [...groups].map(([L, arr]) => `<section class="aidx glass"><h3>${L}</h3><div class="chips">${arr.map(([n, c]) => `<button class="chip artist big" data-act="artist-filter" data-n="${esc(n)}">${esc(n)}<i>${c}</i></button>`).join('')}</div></section>`).join('') : emptyState('还没有认出的画师')}`;
}

/* ================= 编辑器（添加文字串 / 编辑 / 生图） ================= */
function entryEditor(e, { focusGen = false } = {}) {
  const isNew = !e;
  const d = e || { prompt: '', negative: '', params: {}, vibes: [], folderId: S.filters.folder && S.filters.folder !== '__none' ? S.filters.folder : '', note: '' };
  const st = { vibes: structuredClone(d.vibes || []), img: null, arts: e ? artistsOf(e).map(a => ({ ...a })) : null, artsDirty: false, artsReset: false, eng: 'nai', genSeed: null };
  const curLabel = modelLabel(d.params?.modelRaw);
  const m = openModal(`<div class="ed-head"><h3>${isNew ? '添加文字串' : '编辑'}</h3><button class="btn icon-btn ghost" data-act="close">${ic('x')}</button></div>
  <div class="ed-grid">
    <div class="ed-main">
      <label class="field"><span>正面提示词</span><textarea id="edP" rows="6" placeholder="artist:xxx, 1.2::artist:yyy::, best quality, …">${esc(d.prompt)}</textarea></label>
      <label class="field"><span>负面提示词</span><textarea id="edN" rows="3">${esc(d.negative)}</textarea></label>
      <div class="f4">
        <label class="field"><span>模型</span><select id="edM"><option value="">未填</option>${SET.models.map(x => `<option value="${esc(x.api)}" ${curLabel === x.label ? 'selected' : ''}>${esc(x.label)}</option>`).join('')}</select></label>
        <label class="field"><span>Seed</span><input id="edSeed" type="number" value="${d.params?.seed ?? ''}"></label>
        <label class="field"><span>Steps</span><input id="edSteps" type="number" value="${d.params?.steps ?? ''}"></label>
        <label class="field"><span>Scale</span><input id="edScale" type="number" step="0.1" value="${d.params?.scale ?? ''}"></label>
      </div>
      <div class="field"><span>Vibe</span><div id="edV" class="vslots"></div><button class="btn xs" id="edVAdd">${ic('plus', 12)}加一个 vibe</button></div>
      ${e ? `<div class="field"><span>画师 <em class="muted">AI 认错了在这里改，改完自动重新分组</em></span><div id="edA" class="chips"></div><div class="row-inline"><input class="inp" id="edAIn" placeholder="加画师，回车"><button class="btn xs ghost" id="edAReset">恢复自动识别</button></div></div>` : ''}
      <div class="f2"><label class="field"><span>文件夹</span><select id="edF"><option value="">未归档</option>${S.folders.map(f => `<option value="${f.id}" ${d.folderId === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>
      <label class="field"><span>备注</span><input id="edNote" value="${esc(d.note || '')}"></label></div>
    </div>
    <div class="ed-side">
      <div class="ed-img" id="edImg">${e?.thumbId ? `<img data-blob="${e.thumbId}" alt="">` : `<span class="muted">${ic('image', 28)}<br>还没有图</span>`}</div>
      <button class="btn sm" id="edUp">${ic('image', 13)}上传图</button>
      <div class="gen-box">
        <div class="seg" id="edEng"><button data-e="nai" class="on">NAI</button><button data-e="gpt">GPT</button></div>
        <select id="edSize"></select>
        <button class="btn pri" id="edGen">${ic('wand')}生图</button>
        <div class="muted sm" id="edGenMsg">生成的图会在保存时一起存进库里</div>
      </div>
    </div>
  </div>
  <div class="m-actions"><button class="btn" data-act="close">取消</button><button class="btn pri" id="edSave">保存</button></div>`, { wide: true, cls: 'editor' });
  observeThumbs(m);

  const vbox = $('#edV', m);
  const drawVibes = () => {
    vbox.innerHTML = st.vibes.map((v, i) => `<div class="vslot" data-i="${i}">
      <select data-k="vibeId"><option value="">库里没有（只记强度）</option>${S.vibes.map(x => `<option value="${x.id}" ${v.vibeId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <input type="number" step="0.01" data-k="strength" value="${v.strength ?? ''}" placeholder="强度">
      <input type="number" step="0.01" data-k="info" value="${v.info ?? ''}" placeholder="信息提取">
      <button class="btn xs ghost icon-btn" data-k="rm">${ic('x', 12)}</button></div>`).join('') || '<span class="muted sm">没用 vibe</span>';
  };
  vbox.addEventListener('change', ev => { const row = ev.target.closest('.vslot'); const k = ev.target.dataset.k; if (!row || !k) return; const v = st.vibes[+row.dataset.i]; v[k] = k === 'vibeId' ? (ev.target.value || null) : (ev.target.value === '' ? null : +ev.target.value); });
  vbox.addEventListener('click', ev => { const b = ev.target.closest('[data-k="rm"]'); if (!b) return; st.vibes.splice(+b.closest('.vslot').dataset.i, 1); drawVibes(); });
  $('#edVAdd', m).onclick = () => { st.vibes.push({ vibeId: S.vibes[0]?.id || null, strength: 0.6, info: 1, sig: null }); drawVibes(); };
  drawVibes();

  if (e) {
    const abox = $('#edA', m);
    const drawArts = () => { abox.innerHTML = st.arts.map((a, i) => `<span class="chip artist mono">${esc(a.n)}<input class="wt" type="number" step="0.05" value="${a.w}" data-i="${i}"><button data-rm="${i}" aria-label="删除">${ic('x', 11)}</button></span>`).join('') || '<span class="muted sm">没有画师</span>'; };
    abox.addEventListener('click', ev => { const b = ev.target.closest('[data-rm]'); if (!b) return; st.arts.splice(+b.dataset.rm, 1); st.artsDirty = true; drawArts(); });
    abox.addEventListener('change', ev => { const i = ev.target.dataset.i; if (i == null) return; st.arts[+i].w = +ev.target.value || 1; st.artsDirty = true; });
    $('#edAIn', m).onkeydown = ev => { if (ev.key !== 'Enter') return; const n = normTag(ev.target.value); if (n && !st.arts.some(a => a.n === n)) { st.arts.push({ n, w: 1 }); st.artsDirty = true; drawArts(); } ev.target.value = ''; };
    $('#edAReset', m).onclick = () => { st.artsReset = true; st.artsDirty = false; const tmp = { tokens: tokenize($('#edP', m).value) }; st.arts = artistsOf(tmp); drawArts(); toast('保存后按提示词重新识别画师'); };
    drawArts();
  }

  const sizeSel = $('#edSize', m);
  const drawSizes = () => {
    const opts = st.eng === 'nai' ? [['832x1216', '832×1216 竖'], ['1216x832', '1216×832 横'], ['1024x1024', '1024×1024 方']] : [['1024x1536', '1024×1536 竖'], ['1536x1024', '1536×1024 横'], ['1024x1024', '1024×1024 方']];
    const def = st.eng === 'nai' ? SET.nai.size : SET.gpt.size;
    sizeSel.innerHTML = opts.map(([k, t]) => `<option value="${k}" ${k === def ? 'selected' : ''}>${t}</option>`).join('');
  };
  $('#edEng', m).onclick = ev => { const b = ev.target.closest('[data-e]'); if (!b) return; st.eng = b.dataset.e; $$('#edEng button', m).forEach(x => x.classList.toggle('on', x === b)); drawSizes(); };
  drawSizes();

  const showImg = blob => { const u = URL.createObjectURL(blob); $('#edImg', m).innerHTML = `<img src="${u}" class="ld" alt="">`; };
  $('#edUp', m).onclick = () => pickFile('image/*', false, async fs => { if (!fs[0]) return; st.img = { blob: fs[0], source: null }; showImg(fs[0]); });
  const num = id => { const v = $(id, m).value; return v === '' ? null : +v; };

  $('#edGen', m).onclick = async () => {
    const prompt = $('#edP', m).value.trim(); if (!prompt) return toast('先写提示词');
    const btn = $('#edGen', m), msg = $('#edGenMsg', m);
    btn.disabled = true; btn.classList.add('loading'); msg.textContent = '生成中，通常要十几秒…';
    try {
      let blob, seed = null;
      if (st.eng === 'gpt') blob = await genGPT({ prompt, size: sizeSel.value });
      else {
        const api = $('#edM', m).value || SET.nai.model;
        const vibes = [];
        for (const v of st.vibes) { const vb = S.vibes.find(x => x.id === v.vibeId); const enc = await getVibeEncoding(vb, api); if (enc) vibes.push({ enc, strength: v.strength, info: v.info }); else if (vb) toast(`vibe「${esc(vb.name)}」没有这个模型的编码，这次没带上`); }
        const r = await genNAI({ prompt, negative: $('#edN', m).value.trim(), model: api, size: sizeSel.value, seed: num('#edSeed'), steps: num('#edSteps'), scale: num('#edScale'), vibes });
        blob = r.blob; seed = r.seed;
      }
      st.img = { blob, source: 'gen' }; st.genSeed = seed; showImg(blob);
      if (seed != null && !$('#edSeed', m).value) $('#edSeed', m).value = seed;
      msg.textContent = '好了，点保存就会存进库里';
    } catch (err) { msg.textContent = '失败：' + err.message; }
    finally { btn.disabled = false; btn.classList.remove('loading'); }
  };
  if (focusGen) setTimeout(() => $('#edGen', m).scrollIntoView({ block: 'nearest' }), 100);

  $('#edSave', m).onclick = async () => {
    const prompt = $('#edP', m).value.trim();
    if (!prompt && !st.img && !e?.thumbId) return toast('提示词是空的');
    const ent = e || { id: uid(), createdAt: now(), source: 'text', star: false, tokens: [], params: {}, vibes: [] };
    const beforeKey = e ? groupKey(e) : null;
    const promptChanged = ent.prompt !== prompt;
    ent.prompt = prompt; ent.negative = $('#edN', m).value.trim();
    const mv = $('#edM', m).value;
    const keepRaw = ent.params?.modelRaw && !SET.models.some(x => x.label === modelLabel(ent.params.modelRaw));

  const meta = (file.type === 'image/png' || /\.png$/i.test(file.name)) ? await readMeta(buf, file) : null;
  const th = await makeThumb(file);
  const e = { id: uid(), createdAt: now(), source: meta ? 'png' : 'screenshot', star: false, prompt: '', negative: '', chars: [], params: {}, vibes: [], tokens: [], folderId: S.filters.folder && S.filters.folder !== '__none' ? S.filters.folder : '', note: '' };
  e.origId = uid(); e.thumbId = uid(); e.fileHash = hash; e.dims = { w: th.w, h: th.h };
  await putBlob(e.origId, file, 'orig'); await putBlob(e.thumbId, th.blob, 'thumb');
  if (meta) {

function openLightbox(ids, idx, get = id => S.entries.find(x => x.id === id), cap = e => artistsOf(e).map(a => a.n).join(', ')) {
  if (!ids.length) return;
  let i = clamp(idx, 0, ids.length - 1), sc = 1, tx = 0, ty = 0;
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `<div class="lb-stage"><img class="lbimg" alt="" draggable="false"></div><button class="lb-x" aria-label="关闭">${ic('x', 20)}</button>${ids.length > 1 ? `<button class="lb-p" aria-label="上一张">${ic('chev', 22)}</button><button class="lb-n" aria-label="下一张">${ic('chev', 22)}</button>` : ''}<div class="lb-c glass"></div>`;
  document.body.append(lb);
  const img = $('.lbimg', lb), stage = $('.lb-stage', lb);
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  const show = async () => {
    sc = 1; tx = 0; ty = 0; apply();
    const id = ids[i], e = get(id);
    $('.lb-c', lb).textContent = `${i + 1} / ${ids.length}${e ? ' · ' + cap(e) : ''}`;
    if (!e) return;
    const tu = await blobURL(e.thumbId); if (ids[i] === id && tu) img.src = tu;
    const ou = await blobURL(e.origId); if (ids[i] === id && ou) img.src = ou;
  };
  const nav = d => { i = (i + d + ids.length) % ids.length; show(); };
  const close = () => { lb.remove(); S.lb = null; };
  $('.lb-x', lb).onclick = close;
  $('.lb-p', lb) && ($('.lb-p', lb).onclick = () => nav(-1));
  $('.lb-n', lb) && ($('.lb-n', lb).onclick = () => nav(1));
  stage.addEventListener('wheel', ev => { ev.preventDefault(); sc = clamp(sc * (ev.deltaY < 0 ? 1.15 : 1 / 1.15), 1, 8); if (sc === 1) { tx = 0; ty = 0; } apply(); }, { passive: false });
  stage.addEventListener('dblclick', () => { sc = sc > 1 ? 1 : 2.5; tx = 0; ty = 0; apply(); });
  const pts = new Map(); let start = null;
  stage.addEventListener('pointerdown', ev => { stage.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); start = { tx, ty, sc, x: ev.clientX, y: ev.clientY, dist: null, moved: false }; if (pts.size === 2) { const [a, b] = [...pts.values()]; start.dist = Math.hypot(a.x - b.x, a.y - b.y); } });
  stage.addEventListener('pointermove', ev => {
    if (!pts.has(ev.pointerId) || !start) return; pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pts.size === 2 && start.dist) { const [a, b] = [...pts.values()]; sc = clamp(start.sc * Math.hypot(a.x - b.x, a.y - b.y) / start.dist, 1, 8); apply(); return; }
    const dx = ev.clientX - start.x, dy = ev.clientY - start.y; if (Math.abs(dx) + Math.abs(dy) > 6) start.moved = true;
    if (sc > 1) { tx = start.tx + dx; ty = start.ty + dy; apply(); }
  });
  stage.addEventListener('pointerup', ev => {
    pts.delete(ev.pointerId); if (!start) return;
    const dx = ev.clientX - start.x;
    if (sc === 1 && start.moved && Math.abs(dx) > 60 && ids.length > 1) nav(dx < 0 ? 1 : -1);
    else if (!start.moved && ev.target === stage) close();
    if (!pts.size) start = null;
  });
  S.lb = { nav, close };
  show();
}

const REGEX_SYS = `你是 SillyTavern（酒馆）正则脚本专家，帮用户把 AI 回复里的特定格式渲染成美化界面（聊天框、手机界面、信件、状态卡等）。
回复方式：
1. 先用中文简短说明思路：AI 需要输出什么格式的文本，正则怎么匹配。
2. 然后给出且只给出一个 \`\`\`json 代码块，结构如下：
{"scriptName":"名字","findRegex":"/正则/gs","replaceString":"替换成的 HTML","placement":[2],"markdownOnly":true,"promptOnly":false,"trimStrings":[],"sample":"一段能被匹配的示例 AI 回复，前后带一点普通文字","instruction":"让角色按这个格式输出的说明，会写进世界书（中文，不需要可留空）"}
要求：
- findRegex 是 JavaScript 正则字面量字符串，带斜杠和 flags；JSON 里的反斜杠必须写成双反斜杠。
- 推荐用自定义标签包住格式，例如 <wechat>…</wechat>，内部用固定分隔符，用捕获组 $1 $2 取值；需要多条时考虑为每一行单独匹配。
- replaceString 是自包含的 HTML + 内联 <style>，class 名加独特前缀避免冲突；宽度用 max-width:100%，适配手机；不要引用外部图片和脚本。
- 可以使用酒馆宏 {{char}} {{user}}。
- 用户要求修改时，在上一版基础上改，并完整给出新的 json。用户贴来沙盒测试结果时，根据匹配次数和渲染结果找出问题再修。`;
function cardBrief(c) {
  const d = c.data;
  return `当前角色卡：${d.name}\n描述节选：${(d.description || '').slice(0, 600)}\n卡里已有正则：${(d.extensions.regex_scripts || []).map(s => s.scriptName).join('、') || '无'}`;
}
function jsonBlocks(text) {
  const out = []; const re = /```(?:json)?\s*([\s\S]*?)```/gi; let m;
  while ((m = re.exec(text))) { try { const j = JSON.parse(m[1]); if (j && (j.findRegex || j.replaceString)) out.push({ ok: true, j }); } catch (err) { if (/findRegex/.test(m[1])) out.push({ ok: false, err: err.message }); } }
  return out;
}
async function labSend(c, text) {
  const chat = S.cardChat[c.id] ||= [];
  chat.push({ role: 'user', content: text });
  drawLabChat(c, true);
  try {
    const msgs = [{ role: 'system', content: REGEX_SYS + '\n\n' + cardBrief(c) }, ...chat.slice(-16).map(x => ({ role: x.role, content: x.content }))];
    const reply = await aiChat(msgs, { json: false });
    chat.push({ role: 'assistant', content: reply || '（空回复）' });
    const blocks = jsonBlocks(reply || '').filter(b => b.ok);
    if (blocks.length) {
      S.labDraft[c.id] = blocks.at(-1).j;
      if (S.sandbox) { S.sandbox.useDraft = true; S.sandbox.ai = blocks.at(-1).j.sample || S.sandbox.ai; }
      const a = $('#sbAI'); if (a && S.curCard === c.id) { a.value = S.sandbox.ai; autoGrow(a); }
      const d = $('#sbDraft'); if (d) d.checked = true;
    }
  } catch (err) { chat.push({ role: 'assistant', content: '请求失败：' + err.message, err: true }); }
  if (S.view === 'cards' && S.curCard === c.id && S.cardTab === 'lab') { drawLabChat(c); drawSandbox(c); }
}

function cardField(t) {
  const c = curCard(); if (!c) return false;
  const d = c.data;
  if (t.dataset.cf) {
    const p = t.dataset.cf;
    if (p === 'tags') d.tags = t.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    else if (p.startsWith('alt.')) d.alternate_greetings[+p.slice(4)] = t.value;
    else if (p === 'book.name') { d.character_book ||= { name: '', entries: [], extensions: {} }; d.character_book.name = t.value; }
    else d[p] = t.value;
    if (p === 'name') { const h = $('.ctitle h2'); if (h) h.textContent = t.value || '未命名'; const li = $(`.citem[data-cid="${c.id}"] b`); if (li) li.textContent = t.value || '未命名'; }
  } else if (t.dataset.lf) {
    const [i, f] = t.dataset.lf.split(':'); const e = d.character_book?.entries?.[+i]; if (!e) return true;
    if (f === 'keys' || f === 'secondary_keys') e[f] = t.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    else if (f === 'insertion_order') e[f] = +t.value || 0;
    else if (f === 'enabled' || f === 'constant') { e[f] = t.checked; t.closest('.litem')?.classList.toggle('off', f === 'enabled' && !t.checked); }
    else { e[f] = t.value; if (f === 'comment' && e.name !== undefined) e.name = t.value; }
  } else if (t.dataset.rf) {
    const [i, f] = t.dataset.rf.split(':'); const s = d.extensions.regex_scripts[+i]; if (!s) return true;
    if (f === 'enabled') { s.disabled = !t.checked; t.closest('.litem')?.classList.toggle('off', !t.checked); }
    else if (f.startsWith('place')) { const p = +f.slice(5); const set = new Set(s.placement || []); t.checked ? set.add(p) : set.delete(p); s.placement = [...set].sort(); }
    else if (f === 'trimStrings') s.trimStrings = t.value.split('\n').filter(Boolean);
    else if (['markdownOnly', 'promptOnly', 'runOnEdit'].includes(f)) s[f] = t.checked;
    else s[f] = t.value;
  } else return false;
  cardSaveSoon(c); return true;
}

/* ================= 分镜：数据 ================= */
const curBoard = () => S.boards.find(b => b.id === S.curBoard);
function newBoard() {
  return { id: uid(), createdAt: now(), title: '', story: '', mode: 'film', custom: '', count: 6, charsText: '', artist: '', quality: SET.nai.quality, negative: SET.nai.neg, model: SET.nai.model, vibeId: '', vibeStrength: 0.6, fixedSeed: false, seed: null, interval: 3, characters: [], setting: '', shots: [] };
}
const boardTimers = new Map();
function boardSaveSoon(b) { clearTimeout(boardTimers.get(b.id)); boardTimers.set(b.id, setTimeout(() => putBoard(b), 500)); }
const splitTags = s => String(s || '').split(/[,，\n]/).map(x => x.trim()).filter(Boolean);
const COLORS = new Set('black white silver grey gray blonde brown red blue green purple pink orange aqua yellow light-blue dark-blue light-brown light-purple multicolored two-tone gradient streaked platinum blonde'.split(' '));
function conflictFilter(tags, locked) {
  const lockedNorm = new Set(locked.map(normTag));
  const lockedNoun = {};
  for (const t of locked) { const m = normTag(t).match(/^(.+?) (hair|eyes)$/); if (m && COLORS.has(m[1])) (lockedNoun[m[2]] ||= new Set()).add(m[1]); }
  return tags.filter(t => {
    const n = normTag(t); if (lockedNorm.has(n)) return false;
    const m = n.match(/^(.+?) (hair|eyes)$/);
    return !(m && COLORS.has(m[1]) && lockedNoun[m[2]] && !lockedNoun[m[2]].has(m[1]));
  });
}
function dedupe(tags) { const seen = new Set(); return tags.filter(t => { const n = normTag(t); if (!n || seen.has(n)) return false; seen.add(n); return true; }); }
function splitGender(tags) {
  let g = null; const rest = [];
  for (const t of tags) { const m = normTag(t).match(/^(\d+)?\s*(girl|boy|other)s?$/); if (m && !g) g = m[2]; else rest.push(t); }
  return { g: g || 'other', rest };
}
function countTags(chars) {
  const c = { girl: 0, boy: 0, other: 0 };
  for (const ch of chars) c[splitGender(splitTags(ch.tags)).g]++;
  return Object.entries(c).filter(([, n]) => n).map(([k, n]) => n === 1 ? `1${k}` : `${Math.min(n, 6)}${k}s`);
}
function shotPrompt(b, s) {
  const chars = (s.chars || []).map(i => b.characters[i]).filter(Boolean);
  const locked = chars.flatMap(c => splitTags(c.tags));
  const shot = conflictFilter(splitTags(s.tags), locked);
  const setting = s.useSetting === false ? [] : splitTags(b.setting);
  const tail = [...shot, ...setting, ...splitTags(b.quality)];
  const head = splitTags(b.artist);
  const multi = chars.length > 1 && SET.nai.mode === 'nai';
  if (multi) {
    const capts = chars.map(c => { const { g, rest } = splitGender(splitTags(c.tags)); const act = conflictFilter(splitTags(s.actions?.[b.characters.indexOf(c)]), rest); return dedupe([g, ...rest, ...act]).join(', '); });
    return { prompt: dedupe([...head, ...countTags(chars), ...tail]).join(', '), chars: capts, size: SIZES[s.orientation] || SIZES.portrait };
  }
  const body = chars.flatMap(c => { const { rest } = splitGender(splitTags(c.tags)); return [...rest, ...conflictFilter(splitTags(s.actions?.[b.characters.indexOf(c)]), rest)]; });
  return { prompt: dedupe([...head, ...countTags(chars), ...body, ...tail]).join(', '), chars: null, size: SIZES[s.orientation] || SIZES.portrait };
}

/* ================= 分镜：AI 扩写 ================= */
function storySys(b) {
  const md = SHOT_MODES[b.mode] || SHOT_MODES.film, n = clamp(+b.count || 6, 1, 12);
  const beats = md.beats.length ? md.beats.map(x => `- ${x.k}：${x.why}｜参考标签：${x.cam}｜画幅：${x.o}`).join('\n') : `用户的镜头要求：${b.custom || '（未填写，按故事需要自由安排景别和机位）'}`;
  return `你是动画分镜师兼 NovelAI 提示词工程师。把用户的故事拆成正好 ${n} 个镜头，用电影和动画的视觉语言讲故事，并为每个镜头写 NAI（Danbooru 风格）标签。

镜头模式：${md.name}——${md.desc}
可用镜头（按叙事需要挑选、排序，可以重复同一种；相邻镜头的景别或机位要有变化）：
${beats}

只返回 JSON：
{"title":"中文短标题","setting":"所有镜头共用的环境、时代、时间、天气、光线标签","characters":[{"name":"角色名","tags":"外观标签"}],"shots":[{"beat":"镜头名","cn":"一句中文画面描述","tags":"镜头标签","chars":[0],"actions":{"0":"该角色在这个镜头里的动作表情"},"orientation":"landscape|portrait|square","useSetting":true}]}

规则：
1. 标签用英文小写、逗号分隔，Danbooru 写法（单词之间用空格，不用下划线）。不要写画师名，不要写质量词。
2. characters[].tags 只写稳定外观：第一个标签是性别计数（1girl / 1boy / 1other），然后是发色、发型、瞳色、肤色、体型、固定服装、配饰、种族特征。这些在所有镜头里保持不变，代码会自动加到每个有该角色的镜头里。
3. shots[].tags 以镜头景别、机位标签开头（参考上面的参考标签），再写构图、背景、道具、光影、氛围。绝对不要写角色的发色、瞳色、服装等外观。
4. shots[].actions 的键是角色在 characters 里的下标（字符串），值只写这个角色在本镜头的姿势、动作、表情、视线、手持物。
5. 没有人物的空镜：chars 为 []，tags 里写 no humans, scenery。
6. 场景换到别处时 useSetting 设为 false，并在 tags 里写新的环境。
7. orientation：远景、全景、多人同框用 landscape；单人站姿、近景用 portrait；特写物件、Q 版用 square。
8. 镜头总数必须正好 ${n} 个，按叙事顺序排列。
${b.charsText.trim() ? `9. 用户指定了角色外观，以下内容是唯一依据，忠实翻译成标签，不要增删改：\n${b.charsText.trim()}` : '9. 故事里没写到的外观可以合理补全，但一旦定下就保持一致。'}`;
}
async function expandBoard(b) {
  if (!aiReady()) return toast('先在设置里填文字 API');
  if (!b.story.trim()) return toast('先写一段故事或场景');
  const btn = $('#bdExpand'); btn?.classList.add('loading'); if (btn) btn.disabled = true;
  try {
    const t = await aiChat([{ role: 'system', content: storySys(b) }, { role: 'user', content: b.story.trim() }]);
    const j = parseJSONLoose(t);
    const chars = (j.characters || []).map(c => ({ name: String(c.name || '角色'), tags: String(c.tags || '') }));
    const n = clamp(+b.count || 6, 1, 12);
    const shots = (j.shots || []).slice(0, n).map(s => ({
      id: uid(), beat: String(s.beat || ''), cn: String(s.cn || ''), tags: String(s.tags || ''),
      chars: (Array.isArray(s.chars) ? s.chars : []).map(Number).filter(i => i >= 0 && i < chars.length),

    }));

const QU = { running: false, pause: false, wait: false, boardId: null, total: 0, done: 0, cur: null };
function updateAllShots(b) { for (const s of b.shots) updateShotUI(b, s); if (!b.shots.length) updateShotUI(b, {}); }

function updateShotUI(b, s) {
  if (S.view !== 'story' || S.curBoard !== b.id) return renderQueuePill();
  const el = $(`.shot[data-sid="${s.id}"]`);
  if (el) { $('.smedia', el).outerHTML = shotMedia(s); el.className = `shot glass st-${s.status}`; observeThumbs(el); }

async function startQueue(b, onlyIds) {
  if (QU.running) { if (QU.boardId !== b.id) return toast('另一组分镜正在生成，等它结束或暂停'); toast('已加入队列'); }
  if (!SET.nai.key) return toast('先在设置里填 NAI 生图 API');
  for (const s of b.shots) if (onlyIds ? onlyIds.includes(s.id) : (!s.imgId || s.status === 'err')) s.status = 'pending';
  if (QU.running) { QU.total = QU.done + b.shots.filter(s => s.status === 'pending' || s.status === 'run').length; updateAllShots(b); return; }
  Object.assign(QU, { running: true, pause: false, boardId: b.id, done: 0, total: b.shots.filter(s => s.status === 'pending').length });
  if (b.fixedSeed && b.seed == null) b.seed = Math.floor(Math.random() * 4294967295);
  await putBoard(b);
  let vibes = [];
  if (b.vibeId) { const vb = S.vibes.find(v => v.id === b.vibeId); const enc = await getVibeEncoding(vb, b.model || SET.nai.model); if (enc) vibes = [{ enc, strength: b.vibeStrength ?? 0.6, info: 1 }]; else if (vb) toast(`vibe「${esc(vb.name)}」没有这个模型的编码，这次不带 vibe`, 4000); }
  renderQueuePill(); updateAllShots(b);
  try {
    while (!QU.pause) {
      const s = b.shots.find(x => x.status === 'pending'); if (!s) break;
      if (!S.boards.includes(b)) break;
      s.status = 'run'; s.err = ''; QU.cur = s.id; updateShotUI(b, s);
      const pr = shotPrompt(b, s);
      let ok = false;
      for (let attempt = 0; attempt < 2 && !ok; attempt++) {
        try {
          const r = await genNAI({ prompt: pr.prompt, chars: pr.chars, negative: b.negative, model: b.model || SET.nai.model, size: pr.size, seed: b.fixedSeed ? b.seed : null, vibes });
          const th = await makeThumb(r.blob);
          for (const id of [s.imgId, s.thumbId]) if (id) urlCache.delete(id);
          const old = [s.imgId, s.thumbId];
          s.imgId = uid(); s.thumbId = uid(); s.seed = r.seed; s.prompt = pr.prompt; s.charPrompts = pr.chars; s.savedId = null;
          await putBlob(s.imgId, r.blob, 'orig'); await putBlob(s.thumbId, th.blob, 'thumb');
          for (const id of old) if (id && !blobRefd(id)) await DB.del('blobs', id);
          s.status = 'done'; ok = true;
        } catch (err) {
          if (/\b429\b/.test(err.message) && attempt === 0) { s.err = '接口忙，10 秒后重试'; updateShotUI(b, s); await sleep(10000); continue; }
          s.status = 'err'; s.err = err.message; break;
        }
      }
      QU.done++; QU.cur = null; await putBoard(b); updateShotUI(b, s);
      if (b.shots.some(x => x.status === 'pending') && !QU.pause) { QU.wait = true; updateShotUI(b, s); await sleep(Math.max(3, +b.interval || 3) * 1000); QU.wait = false; }
    }
  } finally {
    const left = b.shots.filter(x => x.status === 'pending').length;
    if (QU.pause) for (const s of b.shots) if (s.status === 'pending') s.status = 'idle';
    Object.assign(QU, { running: false, pause: false, wait: false, cur: null });
    await putBoard(b); updateAllShots(b);
    const err = b.shots.filter(x => x.status === 'err').length;
    toast(left && !err ? '已暂停' : err ? `完成，${err} 张失败，可以单独重试` : '这组分镜生成完了');
  }
}

    ${b.characters.map((c, i) => `<div class="lockrow"><input class="inp lname" data-bc="${i}:name" value="${esc(c.name)}"><textarea class="auto mono" rows="1" data-bc="${i}:tags">${esc(c.tags)}</textarea><button class="btn xs ghost icon-btn" data-act="bd-char-del" data-i="${i}" aria-label="删除角色">${ic('x', 12)}</button></div>`).join('')}
